
name: Kairead Modern Build


on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension registrada o all'
        required: true
        default: 'es/aedex'
        type: string
      publish:
        description: 'Publicar APK después de compilar'
        required: true
        default: false
        type: boolean
        

permissions:
  contents: read

concurrency:
  group: kairead-modern-build
  cancel-in-progress: false

jobs:
  preparar:
    name: Leer lista de extensiones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extensions: ${{ steps.lista.outputs.extensions }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar lista
        id: lista
        env:
          SELECTED_EXTENSION: ${{ inputs.extension }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(
              Path("kairead-extensions.json").read_text(encoding="utf-8")
          )
          extensiones = config["extensions"]

          if not extensiones:
              raise ValueError("No hay extensiones configuradas")

          if len(extensiones) != len(set(extensiones)):
              raise ValueError("Hay extensiones duplicadas")

          for extension in extensiones:
              if not re.fullmatch(r"[a-z]{2,3}/[a-z0-9_]+", extension):
                  raise ValueError(f"Nombre invalido: {extension}")

              archivo = Path(f"src/{extension}/build.gradle.kts")
              if not archivo.is_file():
                  raise FileNotFoundError(archivo)
          seleccion = os.environ.get("SELECTED_EXTENSION", "all").strip()

          if seleccion != "all":
              extensiones = [e.strip() for e in seleccion.split(",")]
              if len(extensiones) != len(set(extensiones)) or any(e not in config["extensions"] for e in extensiones):
                  raise ValueError("Extension no registrada o duplicada")
          if os.environ.get("PUBLISH") == "true" and os.environ["GITHUB_REF"] != "refs/heads/main":
              raise ValueError("Solo main puede publicar")

          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(
                  "extensions=" + json.dumps(extensiones) + "\n"
              )

          print("Extensiones preparadas:", extensiones)
          PY

  compilar:
    name: Compilar ${{ matrix.extension }}
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        extension: ${{ fromJSON(needs.preparar.outputs.extensions) }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
        
      - name: Preparar firma digital Kairead
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "ERROR: Falta la clave de firma"
            exit 1
          fi

          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > signingkey.jks
          chmod 600 signingkey.jks
          test -s signingkey.jks
          echo "Clave de firma preparada correctamente"
      
      - name: Compilar extension
        env:
          EXTENSION: ${{ matrix.extension }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          chmod +x ./gradlew

          TAREA=":src:${EXTENSION//\//:}"

          ./gradlew "${TAREA}:spotlessCheck"
          ./gradlew "${TAREA}:assembleRelease" "${TAREA}:lintRelease"
          
      - name: Verificar firma digital Kairead
        env:
          EXTENSION: ${{ matrix.extension }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail

          APK="$(find "src/$EXTENSION/build/outputs" -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          EXPECTED="$(keytool -exportcert -alias "$ALIAS" -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          echo "=== Certificados detectados en la APK ==="
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          echo "APK examinada: $(basename "$APK")"
          echo "Huella esperada: $EXPECTED"
          echo "Huella encontrada: ${ACTUAL:-NO DETECTADA}"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: La APK no tiene la firma esperada"
            exit 1
          fi

          echo "Firma digital Kairead verificada correctamente"
          
      - name: Verificar identidad y preparar nombre de APK
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          ext = os.environ["EXTENSION"]
          root = Path("src") / ext / "build"
          meta = json.loads((root / "keiyoushi-source-info.json").read_text())
          if ext == "es/aedex":
              assert meta["packageName"] == "eu.kanade.tachiyomi.extension.es.templescanesp"
              assert meta["sources"][0]["id"] == 3451196845457607826
              assert int(meta["versionCode"]) > 106071
          apk, = (root / "outputs/apk/release").glob("*.apk")
          pkg = meta["packageName"].removeprefix("eu.kanade.tachiyomi.extension.")
          apk.rename(apk.with_name(f"kairead-{pkg}-v{meta['versionName']}.apk"))
          PY

      - name: Guardar APK individual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Kairead-${{ strategy.job-index }}
          path: src/${{ matrix.extension }}/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publicar APK individual
        if: ${{ inputs.publish == true && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.KAYHELTH_REPO_TOKEN }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          extension = os.environ["EXTENSION"]
          archivos = glob.glob(
              f"src/{extension}/build/outputs/**/*.apk",
              recursive=True,
          )

          if len(archivos) != 1:
              raise SystemExit(
                  f"{extension}: se esperaba una APK, encontradas: {archivos}"
              )

          if not os.environ.get("GH_TOKEN"):
              raise SystemExit("Falta KAYHELTH_REPO_TOKEN")

          def git(carpeta, *argumentos):
              subprocess.run(
                  ["git", "-C", str(carpeta), *argumentos],
                  check=True,
              )

          with tempfile.TemporaryDirectory() as temporal:
              carpeta = Path(temporal) / "repo"

              subprocess.run(["gh", "auth", "setup-git"], check=True)
              subprocess.run([
                  "git", "clone",
                  "https://github.com/helthstin/KayHelthRepo.git",
                  str(carpeta),
              ], check=True)

              import json

              catalogo = json.loads(
                  (carpeta / "index.json").read_text(encoding="utf-8")
              )
              metadata_path = (
                  Path("src") / extension /
                  "build/keiyoushi-source-info.json"
              )
              metadata = json.loads(
                  metadata_path.read_text(encoding="utf-8")
              )
              paquete = metadata["packageName"]

              actual = next(
                  (
                      item
                      for item in catalogo["extensionList"]["extensions"]
                      if item["packageName"] == paquete
                  ),
                  None,
              )

              if actual and int(actual["versionCode"]) >= int(metadata["versionCode"]):
                  print(
                      f"{extension}: versión ya publicada "
                      "o más reciente. Se omite."
                  )
                  raise SystemExit(0)
                  
              destino = carpeta / "apk" / Path(archivos[0]).name
              destino.parent.mkdir(parents=True, exist_ok=True)

              if destino.exists():
                  if destino.read_bytes() != Path(archivos[0]).read_bytes():
                      raise SystemExit("APK existente con contenido distinto")
                  print(
                      f"{extension}: APK existente. "
                      "Se conserva y se revisan sus metadatos."
                  )
              else:
                  shutil.copy2(archivos[0], destino)
                  print(f"{extension}: nueva APK preparada")
              
              subprocess.run([
                  "python3",
                  "scripts/update_extension_index.py",
                  str(carpeta),
                  extension,
                  archivos[0],
              ], check=True)

              git(carpeta, "config", "user.name", "github-actions[bot]")
              git(
                  carpeta, "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              )

              git( carpeta,
                  "add",
                  str(destino.relative_to(carpeta)),
                  "index.json",
              )

              cambios = subprocess.run([
                  "git", "-C", str(carpeta),
                  "diff", "--cached", "--quiet",
              ]).returncode

              if cambios == 0:
                  print(f"{extension}: APK sin cambios")
              else:
                  git(
                      carpeta, "commit",
                      "-m", f"Publicar APK de {extension}",
                  )

                  for intento in range(1, 9):
                      try:
                          git(carpeta, "pull", "--rebase", "origin", "main")
                          git(carpeta, "push", "origin", "main")
                          print(f"{extension}: APK publicada")
                          break
                      except subprocess.CalledProcessError:
                          if intento == 8:
                              raise
                          print("Reintentando publicacion...", intento)
                          time.sleep(3)
          PY
          

      - name: Retirar clave temporal
        if: always()
        run: rm -f signingkey.jks
